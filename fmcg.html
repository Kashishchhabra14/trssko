<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRSSKO | Premium Indian Export & Domestic Supply</title>
    <style>
        /* BASE STYLES */
        :root { --navy: #0b1f3a; --gold: #c9a84c; --green: #1e5631; --white: #ffffff; --cream: #faf8f4; }
        body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--navy); margin: 0; }
        
        /* TAB SYSTEM (The 'Secret' to your request) */
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 15px; }
        .tab-item { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border-bottom: 2px solid transparent; }
        .tab-item.active { border-bottom: 2px solid var(--gold); color: var(--gold); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* PRODUCT CARDS */
        .prod-card { background: var(--white); border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .spec-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.85rem; border-bottom: 1px solid #f9f9f9; }
        .moq-highlight { color: var(--green); font-weight: 800; font-size: 1rem; }
    </style>
</head>
<body>

<!-- FMCG SECTION -->
<section id="fmcg" style="padding: 60px 20px;">
    <div style="max-width: 1000px; margin: auto;">
        <h2>FMCG & Food Products</h2>
        <div class="catalog-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
            
            <!-- PRODUCT ITEM -->
            <div class="prod-card">
                <h4>Turmeric Powder</h4>
                <div class="tabs">
                    <div class="tab-item active" onclick="switchTab(this, 'exp-1')">Export</div>
                    <div class="tab-item" onclick="switchTab(this, 'dom-1')">Domestic</div>
                </div>
                
                <div id="exp-1" class="tab-panel active">
                    <div class="spec-row"><span>MOQ</span><span class="moq-highlight">100 KG</span></div>
                    <p style="font-size: 0.8rem;">Full documentation, Phytosanitary, CoA.</p>
                </div>
                <div id="dom-1" class="tab-panel">
                    <div class="spec-row"><span>MOQ</span><span class="moq-highlight">20 KG</span></div>
                    <p style="font-size: 0.8rem;">GST Compliant, Fast Local Shipping.</p>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- LEGAL SECTION -->
<section id="legal" style="background: var(--navy); color: white; padding: 60px 20px;">
    <div style="max-width: 1000px; margin: auto;">
        <h2>Legal & Compliance Advisory</h2>
        <p>Specialist services for Cyber Law, DPDP Act 2023, and Corporate Compliance.</p>
        <!-- Legal content grid here -->
    </div>
</section>

<script>
    function switchTab(el, panelId) {
        const parent = el.closest('.prod-card');
        parent.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        parent.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        document.getElementById(panelId).classList.add('active');
    }
</script>
</body>
</html>
